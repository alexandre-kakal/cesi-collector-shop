# Analyse SonarQube sur tout le repo (un seul projet SonarQube/SonarCloud)
name: SonarQube - Full Repo

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'
      - '.github/workflows/sonarqube.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.js'

env:
  SONAR_PROJECT_KEY: alexandre-kakal_cesi-collector-shop

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        env:
          AUTH_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          LISTING_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          MEDIA_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          MODERATION_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          npm run prisma:generate:auth
          npm run prisma:generate:listing
          npm run prisma:generate:media
          npm run prisma:generate:moderation

      - name: Run tests with coverage (full repo)
        run: npm run test:cov

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=apps,libs
            -Dsonar.tests=apps,libs
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions=**/*.spec.ts,**/*.module.ts
