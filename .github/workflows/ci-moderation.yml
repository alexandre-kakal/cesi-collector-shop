  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'failure')
    steps:
      - name: Send Discord notification
        run: |
          STATUS="${{ needs.build.result }}"
          COLOR=3066993
          [ "$STATUS" = "failure" ] && COLOR=15158332
          IMAGE_TAG=$(echo "${{ needs.build.outputs.image_tag }}" | head -1)
          payload=$(jq -n \
            --arg content "**Moderation Service** CI/CD — $STATUS" \
            --arg image "$IMAGE_TAG" \
            --argjson color "$COLOR" \
            '{ embeds: [{ title: "CI/CD Notification", description: $content, color: $color, fields: [{ name: "Image", value: $image, inline: false }] }] }')
          curl -sS -H "Content-Type: application/json" -d "$payload" "${{ secrets.DISCORD_WEBHOOK }}" || true
