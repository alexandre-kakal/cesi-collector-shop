name: CI/CD - Moderation Service

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/moderation/**'
      - 'libs/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.moderation'
      - '.github/workflows/ci-moderation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/moderation/**'
      - 'libs/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.moderation'

env:
  SERVICE_NAME: moderation

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npx prettier --check "apps/moderation/**/*.ts"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collector
          POSTGRES_PASSWORD: collector123
          POSTGRES_DB: cesi_moderation_test
        options: >-
          --health-cmd "pg_isready -U collector"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate all Prisma clients
        env:
          AUTH_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          LISTING_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          MEDIA_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          MODERATION_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
        run: |
          npm run prisma:generate:auth
          npm run prisma:generate:listing
          npm run prisma:generate:media
          npm run prisma:generate:moderation

      - name: Run unit tests
        run: npm run test:unit -- --testPathPatterns=apps/moderation

      - name: Run Prisma migrations (moderation)
        run: npx prisma migrate deploy --config apps/moderation/prisma.config.ts
        env:
          MODERATION_DATABASE_URL: postgresql://collector:collector123@localhost:5432/cesi_moderation_test

      - name: Run integration tests
        run: npx jest --testPathPatterns="apps/moderation.*integration-spec" --runInBand --setupFiles=./jest.setup.integration.js --no-watchman
        env:
          MODERATION_DATABASE_URL: postgresql://collector:collector123@localhost:5432/cesi_moderation_test

      - name: Generate coverage report
        run: npm run test:cov -- --testPathPatterns=apps/moderation --coverageDirectory=coverage/moderation

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/moderation/lcov.info
          flags: moderation
          name: moderation-coverage

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=package.json

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/moderation'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker image (GHCR)
        run: echo "DOCKER_IMAGE=ghcr.io/$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')/cesi-shop-moderation" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.moderation
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

