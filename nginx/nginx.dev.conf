events {
    worker_connections 1024;
}

http {
    # Upstream definitions for DEV
    upstream frontend {
        server frontend:5173;  # Vite dev server
    }

    upstream auth {
        server auth:3010;
    }

    upstream listing {
        server listing:3020;
    }

    upstream moderation {
        server moderation:3030;
    }

    upstream media {
        server media:3050;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Server configuration
    server {
        listen 8080;
        server_name localhost cesi-shop.local;

        # Increase buffer sizes for large requests
        client_body_buffer_size 10M;
        client_max_body_size 50M;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Common proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth API
        location /api/auth {
            proxy_pass http://auth;

            # CORS headers for dev
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Listings API (most specific paths first)
        location ~ ^/api/v1/(listings|categories) {
            proxy_pass http://listing;
        }

        # Proxy MinIO files (plus spécifique, doit être avant /api/v1/media)
        location /api/v1/media/files/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Media API (with larger upload size)
        location /api/v1/media {
            proxy_pass http://media;
            client_max_body_size 50M;
        }

        # Moderation API
        location /api/v1/moderation {
            proxy_pass http://moderation;
        }

        # Vite HMR WebSocket
        location /__vite_hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Vite dev assets
        location /@vite {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
        }

        location /node_modules {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
        }

        location /src {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
        }

        # Frontend (catch-all - must be last)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}
