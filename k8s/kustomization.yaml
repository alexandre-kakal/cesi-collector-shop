# Kustomization racine k8s/ — build local (tous les chemins sous k8s/, compatible Kustomize 5)
# Usage: kubectl apply -k k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cesi-shop

resources:
  - base/namespace.yaml
  - base/configmap.yaml
  - base/secrets.yaml
  - base/ingress.yaml
  - infrastructure/postgresql-auth.yaml
  - infrastructure/postgresql-listing.yaml
  - infrastructure/postgresql-media.yaml
  - infrastructure/postgresql-moderation.yaml
  - infrastructure/rabbitmq.yaml
  - infrastructure/redis.yaml
  - infrastructure/minio.yaml
  - apps/auth.yaml
  - apps/listing.yaml
  - apps/media.yaml
  - apps/moderation.yaml

patches:
  - path: local/replicas-patch.yaml
  - path: local/resources-patch.yaml
  - path: local/image-pull-policy-patch.yaml

configMapGenerator:
  - name: local-config
    namespace: cesi-shop
    literals:
      - ENV=local
      - DEBUG=true

# Local : registry localhost:32770 + tag "dev" (évite :latest → imagePullPolicy: IfNotPresent par défaut).
# Faire build + load avec le même tag : make build-images && make minikube-load (TAG=dev par défaut).
# En prod : la CI met à jour k8s/apps/*.yaml avec le tag de version (ex. sha-abc123) → ArgoCD déploie ce tag.
images:
  - name: YOUR_REGISTRY/cesi-shop-auth
    newName: localhost:32770/cesi-shop-auth
    newTag: dev
  - name: YOUR_REGISTRY/cesi-shop-listing
    newName: localhost:32770/cesi-shop-listing
    newTag: dev
  - name: YOUR_REGISTRY/cesi-shop-media
    newName: localhost:32770/cesi-shop-media
    newTag: dev
  - name: YOUR_REGISTRY/cesi-shop-moderation
    newName: localhost:32770/cesi-shop-moderation
    newTag: dev
