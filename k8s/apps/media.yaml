apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: cesi-shop
  labels:
    app: media-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-media 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;']
      - name: wait-for-minio
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z minio 9000; do echo waiting for minio; sleep 2; done;']
      containers:
      - name: media
        image: YOUR_REGISTRY/cesi-shop-media:latest  # À remplacer par votre registry
        command: ["node", "dist/apps/media/apps/media/src/main.js"]
        ports:
        - containerPort: 3050
        env:
        - name: MEDIA_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MEDIA_PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: MEDIA_DATABASE_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: RABBITMQ_URL
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MINIO_ENDPOINT
        - name: MINIO_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MINIO_PORT
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secrets
              key: MINIO_SECRET_KEY
        - name: MINIO_USE_SSL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MINIO_USE_SSL
        - name: MINIO_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MINIO_BUCKET_NAME
        - name: MINIO_PUBLIC_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MINIO_PUBLIC_BASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_EXPIRES_IN
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_PUBLIC_KEY
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3050
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3050
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: cesi-shop
  labels:
    app: media-service
spec:
  selector:
    app: media-service
  ports:
  - port: 3050
    targetPort: 3050
    name: http
  type: ClusterIP
