apiVersion: apps/v1
kind: Deployment
metadata:
  name: listing-service
  namespace: cesi-shop
  labels:
    app: listing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: listing-service
  template:
    metadata:
      labels:
        app: listing-service
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-listing 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done;']
      containers:
      - name: listing
        image: YOUR_REGISTRY/cesi-shop-listing:latest  # À remplacer par votre registry
        command: ["node", "dist/apps/listing/apps/listing/src/main.js"]
        ports:
        - containerPort: 3020
        env:
        - name: LISTING_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LISTING_PORT
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: LISTING_DATABASE_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: RABBITMQ_URL
        - name: MEDIA_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MEDIA_SERVICE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_EXPIRES_IN
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_PUBLIC_KEY
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3020
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3020
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: listing-service
  namespace: cesi-shop
  labels:
    app: listing-service
spec:
  selector:
    app: listing-service
  ports:
  - port: 3020
    targetPort: 3020
    name: http
  type: ClusterIP
