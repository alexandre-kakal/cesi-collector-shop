# Réduire les ressources pour l'environnement local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cesi-shop
spec:
  template:
    spec:
      containers:
      - name: auth
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

