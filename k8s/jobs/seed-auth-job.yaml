# Job à lancer une seule fois (ex. après déploiement) pour seed la DB Auth.
# Ne pas lancer le seed depuis les pods de l'API pour éviter que plusieurs replicas le fassent en parallèle.
#
# Usage : kubectl apply -f k8s/jobs/seed-auth-job.yaml
#         ou inclure ce Job dans votre pipeline de déploiement (une fois par env).
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-auth
  namespace: cesi-shop
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-auth 5432; do echo waiting for postgres-auth; sleep 2; done; echo postgres-auth ready']
        - name: prisma-migrate
          image: YOUR_REGISTRY/cesi-shop-auth:dev
          workingDir: /app/apps/auth
          command: ['npx', 'prisma', 'migrate', 'deploy', '--config', './prisma.config.ts']
          env:
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: AUTH_DATABASE_URL
      containers:
        - name: seed
          image: YOUR_REGISTRY/cesi-shop-auth:dev
          command: ['node', 'dist/apps/auth/apps/auth/src/seed-runner.js']
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "300m"
              ephemeral-storage: "256Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: AUTH_DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
                  optional: true
