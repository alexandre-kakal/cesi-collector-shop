# Job pour appliquer les migrations Prisma sur toutes les bases de données
# Usage: kubectl apply -f k8s/jobs/migrate-all.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-auth
  namespace: cesi-shop
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-auth 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: migrate
          image: cesi-shop-auth:dev
          workingDir: /app
          command: ['npx', 'prisma', 'migrate', 'deploy', '--config', 'apps/auth/prisma.config.ts']
          env:
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: AUTH_DATABASE_URL
