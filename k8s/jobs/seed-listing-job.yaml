# Job seed Listing — à lancer une fois après Auth et Media.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-listing
  namespace: cesi-shop
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-listing 5432; do echo waiting for postgres-listing; sleep 2; done; echo postgres-listing ready']
        - name: prisma-migrate
          image: cesi-shop-listing:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ['npx', 'prisma', 'migrate', 'deploy', '--config', 'apps/listing/prisma.config.ts']
          env:
            - name: LISTING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: LISTING_DATABASE_URL
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done; echo rabbitmq ready']
      containers:
        - name: seed
          image: cesi-shop-listing:dev
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/apps/listing/apps/listing/src/seed-runner.js']
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "300m"
              ephemeral-storage: "256Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: LISTING_DATABASE_URL
            - name: LISTING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: LISTING_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: JWT_SECRET
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: JWT_PUBLIC_KEY
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
                  optional: true
