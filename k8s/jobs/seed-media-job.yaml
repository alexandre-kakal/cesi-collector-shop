# Job seed Media — à lancer une fois après Auth.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-media
  namespace: cesi-shop
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-media 5432; do echo waiting for postgres-media; sleep 2; done; echo postgres-media ready']
        - name: prisma-migrate
          image: YOUR_REGISTRY/cesi-shop-media:dev
          workingDir: /app/apps/media
          command: ['npx', 'prisma', 'migrate', 'deploy', '--config', './prisma.config.ts']
          env:
            - name: MEDIA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MEDIA_DATABASE_URL
      containers:
        - name: seed
          image: YOUR_REGISTRY/cesi-shop-media:dev
          command: ['node', 'dist/apps/media/apps/media/src/seed-runner.js']
          securityContext:
            runAsUser: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "300m"
              ephemeral-storage: "256Mi"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: MEDIA_DATABASE_URL
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: JWT_PUBLIC_KEY
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: RABBITMQ_URL
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MINIO_ENDPOINT
            - name: MINIO_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MINIO_PORT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secrets
                  key: MINIO_SECRET_KEY
            - name: MINIO_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MINIO_USE_SSL
            - name: MINIO_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: MINIO_BUCKET_NAME
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NODE_ENV
                  optional: true
