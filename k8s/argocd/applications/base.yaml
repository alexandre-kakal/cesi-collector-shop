apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cesi-shop-base
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: cesi-shop

  source:
    repoURL: https://github.com/YOUR_USERNAME/cesi-collector-shop.git  # À remplacer
    targetRevision: main
    path: k8s/base
    # Déchiffrement SOPS : le CMP "sops" déchiffre secrets.enc.yaml puis exécute kustomize build
    plugin:
      name: sops

  destination:
    server: https://kubernetes.default.svc
    namespace: cesi-shop

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
