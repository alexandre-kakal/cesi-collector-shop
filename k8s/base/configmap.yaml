apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cesi-shop
data:
  # Service ports
  AUTH_PORT: "3010"
  LISTING_PORT: "3020"
  MEDIA_PORT: "3050"
  MODERATION_PORT: "3030"

  # RabbitMQ configuration (URL avec credentials dans secrets)
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"

  # Redis configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # MinIO configuration
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET_NAME: "media-uploads"
  MINIO_PUBLIC_BASE_URL: "http://cesi-shop.local/api/v1/media/files"

  # Service-to-service (cluster interne)
  MEDIA_SERVICE_URL: "http://media-service:3050"

  # Node environment
  NODE_ENV: "production"

  # Better Auth: URL publique du front / ingress (évite l’avertissement et les refus CSRF)
  BETTER_AUTH_URL: "http://cesi-shop.local"
