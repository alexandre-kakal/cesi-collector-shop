apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cesi-shop-ingress
  namespace: cesi-shop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: cesi-shop.local  # À remplacer par votre domaine
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3010
      - path: /api/v1/listings
        pathType: Prefix
        backend:
          service:
            name: listing-service
            port:
              number: 3020
      - path: /api/v1/categories
        pathType: Prefix
        backend:
          service:
            name: listing-service
            port:
              number: 3020
      - path: /api/v1/media
        pathType: Prefix
        backend:
          service:
            name: media-service
            port:
              number: 3050
      - path: /api/v1/moderation
        pathType: Prefix
        backend:
          service:
            name: moderation-service
            port:
              number: 3030
      # Frontend (catch-all - MUST BE LAST)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
