# Ingress séparé pour le proxy MinIO (rewrite /api/v1/media/files/xxx -> /xxx)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cesi-shop-minio-ingress
  namespace: cesi-shop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://cesi-shop.local"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - cesi-shop.local
    secretName: cesi-shop-tls
  rules:
  - host: cesi-shop.local
    http:
      paths:
      - path: /api/v1/media/files(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: minio
            port:
              number: 9000
