# Template des secrets - NE PAS COMMITER après avoir rempli les valeurs.
# 1. Copier ce fichier vers secrets.yaml : cp secrets.example.yaml secrets.yaml
# 2. Remplacer les placeholders par vos vraies valeurs
# 3. Chiffrer : sops --encrypt secrets.yaml > secrets.enc.yaml
# 4. Committer secrets.enc.yaml (pas secrets.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: cesi-shop
type: Opaque
stringData:
  POSTGRES_USER: cesishop
  POSTGRES_PASSWORD: "<REMPLACER_MOT_DE_PASSE_PRODUCTION>"
  AUTH_DATABASE_URL: "postgresql://cesishop:<MDP>@postgres-auth:5432/auth?schema=public"
  LISTING_DATABASE_URL: "postgresql://cesishop:<MDP>@postgres-listing:5432/listing?schema=public"
  MEDIA_DATABASE_URL: "postgresql://cesishop:<MDP>@postgres-media:5432/media?schema=public"
  MODERATION_DATABASE_URL: "postgresql://cesishop:<MDP>@postgres-moderation:5432/moderation?schema=public"

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secrets
  namespace: cesi-shop
type: Opaque
stringData:
  JWT_SECRET: "<REMPLACER_JWT_SECRET_FORT>"
  JWT_EXPIRES_IN: "24h"

---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: cesi-shop
type: Opaque
stringData:
  MINIO_ROOT_USER: "<REMPLACER>"
  MINIO_ROOT_PASSWORD: "<REMPLACER>"
  MINIO_ACCESS_KEY: "<REMPLACER>"
  MINIO_SECRET_KEY: "<REMPLACER>"
