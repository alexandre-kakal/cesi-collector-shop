apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-listing-pvc
  namespace: cesi-shop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-listing
  namespace: cesi-shop
  labels:
    app: postgres-listing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-listing
  template:
    metadata:
      labels:
        app: postgres-listing
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: listing
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - cesishop_dev
            - -d
            - listing
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - cesishop_dev
            - -d
            - listing
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-listing-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-listing
  namespace: cesi-shop
spec:
  selector:
    app: postgres-listing
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
